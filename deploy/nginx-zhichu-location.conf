# 固定支出 monthly fixed expenses over HTTPS; app: /root/固定支出 (python on 172.18.0.1:8130, systemd guding-zhichu).
location = /zhichu { return 308 https://example.com/zhichu/; }
location ^~ /zhichu/ {
    proxy_pass http://172.18.0.1:8130/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /zhichu;
    # Overwrite any client-supplied value; real visitor IP via the Cloudflare-verified mapping.
    proxy_set_header X-Real-IP $daohang_client_ip;
    proxy_set_header X-Forwarded-For $daohang_client_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
    proxy_buffering off;
    proxy_cache off;
    add_header Strict-Transport-Security $hsts_header always;
}
